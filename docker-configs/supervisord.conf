
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:laravel-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /production/shikaticket/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=application
numprocs=2
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopwaitsecs=3600

[program:laravel-scheduler]
process_name=%(program_name)s
command=php /production/shikaticket/artisan schedule:work
directory=/production/shikaticket
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
user=application
numprocs=1
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopwaitsecs=60
